{% extends 'dbsk/cal_base2.html' %}
{% block headstuff %}
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

{% endblock %}

{% block content %}
    <button onclick="window.print()">Print</button>
    <a href="{% url 'dbsk:index' %}">Back to main menu</a>
    <p>
        Soup providers: Thank you for your generosity. Please ensure soup temperature above 160 and container filled.
    </p>
    <div class="clearfix">
        <a class="btn btn-info left" href="{% url 'dbsk:schedule' %}?{{ prev_month }}"> Previous Month </a>
        <a class="btn btn-info right" href="{% url 'dbsk:schedule' %}?{{ next_month }}"> Next Month </a>
    </div>
    {{ calendar }}
{% endblock %}
